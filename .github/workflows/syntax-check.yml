name: Syntax Check

# Cek cepat node --check di semua file .js sebelum merge — bukan pengganti
# test suite penuh, tapi menangkap typo/syntax error yang selama ini
# ditemukan manual lewat audit. Jalan di setiap push & pull request ke main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check syntax of all JS files
        run: |
          set -e
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            if ! node --check "$f"; then
              echo "::error file=$f::Syntax error di $f"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "Ada file dengan syntax error — lihat detail di atas."
            exit 1
          fi
          echo "Semua file JS lolos syntax check."

  # Sebelumnya CI hanya cek syntax (node --check) — test_suite.js,
  # test_financial_policy.js, test_provider_functions.js, dan
  # test_security_regressions.js (114+18+6+5 assertion) HANYA dijalankan
  # manual, tidak pernah otomatis. Job ini menutup celah itu: menjalankan
  # `npm test` yang sama persis dengan yang dijalankan manual sebelum setiap
  # commit selama pengembangan ini. Tidak boot server.js sungguhan (tidak
  # butuh credentials Supabase/Redis/GenAI) — tapi beberapa file test
  # MEMUAT modul lain lewat `vm`/import yang pada gilirannya require()
  # dependency npm asli (mis. test_financial_policy.js -> lib/idx-data-
  # engine.js -> lib/invezgo-client.js -> @upstash/redis), jadi `npm ci`
  # tetap wajib sebelum `npm test` — ketahuan gagal (ERR_MODULE_NOT_FOUND)
  # di run pertama job ini sebelum langkah ini ditambahkan.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (npm test)
        run: npm test
