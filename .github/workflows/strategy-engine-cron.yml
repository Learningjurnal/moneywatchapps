name: Strategy Engine Rotating Scan

# Memanggil GET /api/cron/warm-strategy-engine (server.js) secara terjadwal
# — pengganti Vercel native cron untuk fitur ini. Vercel Hobby cuma
# mengizinkan 2 cron job per project, dan 2 slot itu sudah dipakai oleh
# /api/cron/warm-radar-fundamentals (05:00 WIB) dan
# /api/cron/warm-technical-indicators (05:30 WIB) — lihat komentar di
# server.js dan lib/engine/strategy/StrategyEngine.js untuk detailnya.
# GitHub Actions tidak punya batas jumlah workflow terjadwal seperti itu,
# jadi dipakai sebagai penjadwal eksternal untuk cron ke-3 ini.
#
# WAJIB disiapkan sebelum workflow ini bisa jalan (Settings > Secrets and
# variables > Actions > New repository secret):
#   - MONEYWATCH_APP_URL : URL production app, mis. https://nama-app-anda.vercel.app
#                          (tanpa trailing slash)
#   - CRON_SECRET        : NILAI YANG SAMA PERSIS dengan env var CRON_SECRET
#                          yang sudah di-set di Vercel project settings —
#                          endpoint ini menolak (403) request tanpa header
#                          Authorization yang cocok.
#
# FIX (2026-09-24, user-reported: widget Rekomendasi Harian di halaman
# Screener selalu kosong — "apakah ini normal?"): sebelum fix ini, jadwal
# di bawah HANYA PERNAH memanggil strategy=swing-flow (default hardcoded,
# dan event `schedule` tidak pernah membawa `github.event.inputs`, jadi
# fallback-nya selalu kepakai). day-trading/momentum-candidate/
# hidden-accumulation TIDAK PERNAH ter-scan otomatis sama sekali —
# getDailyTopPicks() (lib/engine/strategy/StrategyEngine.js) menggabung
# sinyal dari SEMUA 4 strategi, jadi 3 dari 4 sumbernya selalu kosong.
# Sekarang 4 jadwal terpisah, satu per strategi (beda 5 menit tiap
# strategi supaya tidak saling tabrak start time), dan job di bawah
# memetakan `github.event.schedule` (string cron yang memicu run itu) ke
# strategy id yang sesuai — workflow_dispatch manual tetap bisa override
# lewat input `strategy` seperti biasa.
on:
  schedule:
    - cron: '35 22 * * 1-5'   # 22:35 UTC = 05:35 WIB, Senin-Jumat (hari bursa) — swing-flow
    - cron: '40 22 * * 1-5'   # 22:40 UTC = 05:40 WIB — day-trading
    - cron: '45 22 * * 1-5'   # 22:45 UTC = 05:45 WIB — momentum-candidate
    - cron: '50 22 * * 1-5'   # 22:50 UTC = 05:50 WIB — hidden-accumulation
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy id (default: swing-flow — satu-satunya yang tanpa mandatory condition, jadi paling cepat progress per run)'
        required: false
        default: 'swing-flow'

jobs:
  warm-strategy-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint cron Strategy Engine
        env:
          APP_URL: ${{ secrets.MONEYWATCH_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_STRATEGY: ${{ github.event.inputs.strategy }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secret MONEYWATCH_APP_URL dan/atau CRON_SECRET belum diset di repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          # workflow_dispatch manual selalu menang kalau diisi. Kalau tidak
          # (kasus terjadwal), petakan cron string yang memicu run ini ke
          # strategy id yang sesuai — lihat komentar `on.schedule` di atas.
          STRATEGY_ID="${INPUT_STRATEGY:-}"
          if [ -z "$STRATEGY_ID" ]; then
            case "$SCHEDULE_CRON" in
              '35 22 * * 1-5') STRATEGY_ID='swing-flow' ;;
              '40 22 * * 1-5') STRATEGY_ID='day-trading' ;;
              '45 22 * * 1-5') STRATEGY_ID='momentum-candidate' ;;
              '50 22 * * 1-5') STRATEGY_ID='hidden-accumulation' ;;
              *) STRATEGY_ID='swing-flow' ;;
            esac
          fi

          echo "Memanggil ${APP_URL}/api/cron/warm-strategy-engine?strategy=${STRATEGY_ID} ..."
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/warm-strategy-engine?strategy=${STRATEGY_ID}")

          echo "--- Response body ---"
          cat response.json
          echo ""
          echo "--- HTTP status: ${http_code} ---"

          if [ "$http_code" != "200" ]; then
            echo "::error::Endpoint mengembalikan HTTP ${http_code} (403 = CRON_SECRET tidak cocok dengan yang di-set di Vercel; cek dulu sebelum menuduh bug lain)."
            exit 1
          fi
